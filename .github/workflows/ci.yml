name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  php74-syntax:
    # The plugin ships to PHP 7.4 but is developed and tested on 8.x, because
    # PHPUnit's own dependency tree requires 8.0+. Nothing else in CI would
    # notice an enum, a match(), a ?-> or a promoted constructor property
    # creeping back in — it would parse everywhere here and fatal on a client
    # server instead. This job is that tripwire: no dependencies, just the
    # oldest supported parser reading every file the release package ships.
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint every shipped file
        run: |
          status=0
          while IFS= read -r file; do
            # php -l reports on stdout, so capture it and only speak up on
            # failure; otherwise this drowns in "No syntax errors detected".
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find src brace.php uninstall.php -name '*.php')
          exit $status

  phpcs:
    name: PHPCS (WPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: composer phpcs

  phpstan:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer phpstan

  unit:
    # PRs run PHP 8.1 only; pushes to main run the full matrix.
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ github.event_name == 'push' && fromJSON('["8.1", "8.2", "8.3"]') || fromJSON('["8.1"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run unit tests
        run: composer test

  plugin-check:
    # Covers the WP.org plugin checks including readme.txt validation.
    name: WP Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install runtime autoloader
        run: composer install --no-dev --prefer-dist --no-progress
      - name: Build release package
        # Mirror the WP.org deploy: check only what .distignore keeps,
        # under the real plugin slug instead of the repo name.
        run: |
          mkdir -p build/brace
          rsync -a --delete --exclude-from=.distignore ./ build/brace/
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/brace'
          slug: 'brace'

  i18n:
    name: i18n makepot check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Download WP-CLI
        run: curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
      - name: Make POT (validates i18n usage)
        run: php wp-cli.phar i18n make-pot . /tmp/brace.pot --slug=brace --exclude=vendor,tests,build
